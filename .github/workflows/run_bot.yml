name: Auto Check Kho Nhua HVT

on:
  schedule:
    # GitHub Actions dùng UTC:
    # 04:00 UTC = 11:00 giờ Việt Nam
    # 09:00 UTC = 16:00 giờ Việt Nam
    - cron: '0 4,9 * * *'

  # Cho phép bấm chạy thử thủ công từ GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Script
        env:
          KHO_COOKIE: ${{ secrets.KHO_COOKIE }}
          COOKIE_HCM: ${{ secrets.COOKIE_HCM }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: python bot_update_tonkho_lark.py
